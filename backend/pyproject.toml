[project]
name = "open-icd-coder-backend"
version = "0.1.0"
license = "MIT"
description = "AI-augmented medical coding prototype: ICD-10-CM terminology search + Jev decision layer"
requires-python = ">=3.12"

dependencies = [
    "alembic>=1.14.0",
    "asyncpg>=0.31.0",
    "dependency-injector>=4.48.3",
    "fastapi[standard]>=0.129.0",
    "httpx>=0.28.1",
    "pgvector>=0.4.1",
    "pydantic-settings>=2.13.0",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2.0.46",
    "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
]
